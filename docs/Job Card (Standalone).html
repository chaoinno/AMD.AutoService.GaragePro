document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

8px 40px 60px; display:flex; flex-direction:column; gap:20px;\">\n\n  <!-- Header -->\n  <div style=\"background:#171b23; border-radius:14px; padding:22px 28px; display:flex; justify-content:space-between; align-items:center; color:#fff;\">\n    <div>\n      <div style=\"font-size:19px; font-weight:700; letter-spacing:0.2px;\">ใบสั่งงานซ่อม (Job Card)<\u002Fdiv>\n      <div style=\"font-size:13px; color:#9aa1ad; margin-top:2px;\">เลขที่ <span style=\"font-family:'IBM Plex Mono',monospace; color:#e6873f;\">JC-2026-0847<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; align-items:center; gap:28px;\">\n      <div style=\"text-align:right;\">\n        <div style=\"font-size:12px; color:#9aa1ad;\">ทะเบียนรถ<\u002Fdiv>\n        <div style=\"font-size:18px; font-weight:700; font-family:'IBM Plex Mono',monospace;\">กก 3821 กรุงเทพมหานคร<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width:1px; height:34px; background:#333a47;\"><\u002Fdiv>\n      <div style=\"text-align:right;\">\n        <div style=\"font-size:12px; color:#9aa1ad;\">วันที่รับรถ<\u002Fdiv>\n        <div style=\"font-size:14px; font-weight:600;\">31 ส.ค. 2569<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"{{ overallBadgeStyle }}\">{{ overallBadgeText }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Stepper / State tabs -->\n  <div style=\"background:#171b23; border-radius:14px; padding:22px 32px 26px;\">\n    <div style=\"display:flex; align-items:flex-start;\">\n      <sc-for list=\"{{ stages }}\" as=\"stage\" hint-placeholder-count=\"5\">\n        <div style=\"display:flex; align-items:flex-start; flex:{{ stage.flexGrow }};\">\n          <div sc-camel-on-click=\"{{ stage.onClick }}\" style=\"display:flex; flex-direction:column; align-items:center; gap:10px; cursor:pointer; min-width:74px;\">\n            <div style=\"{{ stage.circleStyle }}\">\n              <sc-if value=\"{{ stage.showCheck }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"font-size:18px; line-height:1;\">✓<\u002Fspan>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ stage.showNumber }}\" hint-placeholder-val=\"{{ true }}\">\n                <span>{{ stage.number }}<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"{{ stage.labelStyle }}\">{{ stage.label }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ stage.hasConnector }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"{{ stage.connectorStyle }}\"><\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- ============ TAB 0: รับรถ ============ -->\n  <sc-if value=\"{{ isTab0 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:grid; grid-template-columns:1.1fr 1fr; gap:20px; align-items:start;\">\n      <div style=\"background:#fff; border-radius:14px; padding:26px 28px; border:1px solid #e3e5ea;\">\n        <div style=\"font-size:16px; font-weight:700; color:#171b23; margin-bottom:18px; padding-bottom:12px; border-bottom:2px solid #f1f2f5;\">ข้อมูลลูกค้า &amp; รถ<\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:18px 22px;\">\n          <div><div style=\"font-size:12px; color:#8b909b; margin-bottom:4px;\">ชื่อลูกค้า<\u002Fdiv><div style=\"font-size:15px; font-weight:600; color:#1f2430;\">คุณสมชาย วัฒนกิจ<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:12px; color:#8b909b; margin-bottom:4px;\">เบอร์โทรศัพท์<\u002Fdiv><div style=\"font-size:15px; font-weight:600; color:#1f2430; font-family:'IBM Plex Mono',monospace;\">081-234-5678<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:12px; color:#8b909b; margin-bottom:4px;\">ยี่ห้อ / รุ่น<\u002Fdiv><div style=\"font-size:15px; font-weight:600; color:#1f2430;\">Toyota Yaris Ativ 2022<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:12px; color:#8b909b; margin-bottom:4px;\">สีรถ<\u002Fdiv><div style=\"font-size:15px; font-weight:600; color:#1f2430;\">ขาวมุก<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:12px; color:#8b909b; margin-bottom:4px;\">เลขไมล์ (กม.)<\u002Fdiv><div style=\"font-size:15px; font-weight:600; color:#1f2430; font-family:'IBM Plex Mono',monospace;\">48,210<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:12px; color:#8b909b; margin-bottom:4px;\">ระดับน้ำมัน<\u002Fdiv><div style=\"font-size:15px; font-weight:600; color:#1f2430;\">3/4 ถัง<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:12px; color:#8b909b; margin-bottom:4px;\">รับรถโดย<\u002Fdiv><div style=\"font-size:15px; font-weight:600; color:#1f2430;\">ช่างต้อม (หน้าร้าน)<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:12px; color:#8b909b; margin-bottom:4px;\">เวลารับรถ<\u002Fdiv><div style=\"font-size:15px; font-weight:600; color:#1f2430;\">09:20 น.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:20px;\">\n          <div style=\"font-size:12px; color:#8b909b; margin-bottom:6px;\">อาการที่ลูกค้าแจ้ง<\u002Fdiv>\n          <div style=\"font-size:14px; color:#3a3f4a; background:#f7f8fa; border-radius:10px; padding:14px 16px; line-height:1.6;\">เบรกมีเสียงดังตอนเหยียบ และรู้สึกรถสั่นเวลาขับความเร็วสูงกว่า 80 กม./ชม. ขอให้ช่วยตรวจเช็คระบบเบรกและช่วงล่างโดยละเอียด<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#fff; border-radius:14px; padding:26px 28px; border:1px solid #e3e5ea;\">\n        <div style=\"font-size:16px; font-weight:700; color:#171b23; margin-bottom:18px; padding-bottom:12px; border-bottom:2px solid #f1f2f5;\">รูปถ่ายสภาพรถก่อนรับซ่อม<\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:14px;\">\n          <div>\n            <div style=\"height:130px; border-radius:10px; overflow:hidden; margin-bottom:6px;\"><image-slot id=\"photo-front\" shape=\"rect\" placeholder=\"ด้านหน้า\"><\u002Fimage-slot><\u002Fdiv>\n            <div style=\"font-size:12px; color:#8b909b; text-align:center;\">ด้านหน้า<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"height:130px; border-radius:10px; overflow:hidden; margin-bottom:6px;\"><image-slot id=\"photo-back\" shape=\"rect\" placeholder=\"ด้านหลัง\"><\u002Fimage-slot><\u002Fdiv>\n            <div style=\"font-size:12px; color:#8b909b; text-align:center;\">ด้านหลัง<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"height:130px; border-radius:10px; overflow:hidden; margin-bottom:6px;\"><image-slot id=\"photo-left\" shape=\"rect\" placeholder=\"ด้านซ้าย\"><\u002Fimage-slot><\u002Fdiv>\n            <div style=\"font-size:12px; color:#8b909b; text-align:center;\">ด้านซ้าย<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"height:130px; border-radius:10px; overflow:hidden; margin-bottom:6px;\"><image-slot id=\"photo-right\" shape=\"rect\" placeholder=\"ด้านขวา\"><\u002Fimage-slot><\u002Fdiv>\n            <div style=\"font-size:12px; color:#8b909b; text-align:center;\">ด้านขวา<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:18px; display:flex; align-items:center; gap:14px;\">\n          <div style=\"width:120px; height:64px; border-radius:8px; overflow:hidden; flex-shrink:0;\"><image-slot id=\"signature-receive\" shape=\"rect\" placeholder=\"ลายเซ็นลูกค้า\"><\u002Fimage-slot><\u002Fdiv>\n          <div style=\"font-size:13px; color:#6b7280; line-height:1.5;\">ลายเซ็นลูกค้ารับทราบสภาพรถและเงื่อนไขการรับซ่อม<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ TAB 1: ตรวจสอบ ============ -->\n  <sc-if value=\"{{ isTab1 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#fff; border-radius:14px; padding:26px 28px; border:1px solid #e3e5ea;\">\n      <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; padding-bottom:12px; border-bottom:2px solid #f1f2f5;\">\n        <div style=\"font-size:16px; font-weight:700; color:#171b23;\">รายการตรวจเช็คสภาพรถ<\u002Fdiv>\n        <div style=\"font-size:13px; color:#8b909b;\">ผู้ตรวจสอบ: <span style=\"font-weight:600; color:#1f2430;\">ช่างวิน<\u002Fspan> · เวลา 09:45 น.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:2fr 1fr 3fr; padding:0 4px 10px; font-size:12px; color:#8b909b; font-weight:600;\">\n        <div>รายการตรวจ<\u002Fdiv><div>ผลตรวจ (คลิกเพื่อเปลี่ยน)<\u002Fdiv><div>หมายเหตุ<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-for list=\"{{ checklist }}\" as=\"item\" hint-placeholder-count=\"8\">\n        <div style=\"display:grid; grid-template-columns:2fr 1fr 3fr; align-items:center; padding:13px 4px; border-top:1px solid #f1f2f5;\">\n          <div style=\"font-size:14px; font-weight:600; color:#1f2430;\">{{ item.name }}<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ item.onClick }}\" style=\"{{ item.badgeStyle }}\">{{ item.badgeLabel }}<\u002Fdiv>\n          <div style=\"font-size:13px; color:#6b7280;\">{{ item.note }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"margin-top:22px; display:flex; justify-content:flex-end;\">\n        <button sc-camel-on-click=\"{{ advanceStage }}\" style=\"{{ advanceButtonStyle }}\">ยืนยันผลตรวจสอบ &amp; ไปขั้นตอนถัดไป →<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ TAB 2: เสนอราคา/งานซ่อม ============ -->\n  <sc-if value=\"{{ isTab2 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#fff; border-radius:14px; padding:26px 28px; border:1px solid #e3e5ea;\">\n      <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; padding-bottom:12px; border-bottom:2px solid #f1f2f5;\">\n        <div style=\"font-size:16px; font-weight:700; color:#171b23;\">ใบเสนอราคา &amp; รายการซ่อม<\u002Fdiv>\n        <div style=\"{{ quoteStatusStyle }}\">{{ quoteStatusLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:3fr 1fr 1fr 1fr 1fr; padding:0 4px 10px; font-size:12px; color:#8b909b; font-weight:600;\">\n        <div>รายการ<\u002Fdiv><div>จำนวน<\u002Fdiv><div>ราคา/หน่วย<\u002Fdiv><div>รวม<\u002Fdiv><div>อนุมัติ<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-for list=\"{{ quoteItems }}\" as=\"item\" hint-placeholder-count=\"4\">\n        <div style=\"display:grid; grid-template-columns:3fr 1fr 1fr 1fr 1fr; align-items:center; padding:13px 4px; border-top:1px solid #f1f2f5;\">\n          <div style=\"font-size:14px; font-weight:600; color:#1f2430;\">{{ item.name }}<\u002Fdiv>\n          <div style=\"font-size:14px; color:#3a3f4a; font-family:'IBM Plex Mono',monospace;\">{{ item.qty }}<\u002Fdiv>\n          <div style=\"font-size:14px; color:#3a3f4a; font-family:'IBM Plex Mono',monospace;\">{{ item.priceLabel }}<\u002Fdiv>\n          <div style=\"font-size:14px; font-weight:600; color:#1f2430; font-family:'IBM Plex Mono',monospace;\">{{ item.totalLabel }}<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ item.onClick }}\" style=\"{{ item.approveStyle }}\">{{ item.approveLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"display:flex; justify-content:flex-end; margin-top:18px;\">\n        <div style=\"width:280px; display:flex; flex-direction:column; gap:8px;\">\n          <div style=\"display:flex; justify-content:space-between; font-size:13px; color:#6b7280;\"><span>รวมก่อนภาษี<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;\">{{ subtotalLabel }}<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; font-size:13px; color:#6b7280;\"><span>ภาษีมูลค่าเพิ่ม 7%<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;\">{{ vatLabel }}<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; font-size:16px; font-weight:700; color:#171b23; padding-top:8px; border-top:2px solid #f1f2f5;\"><span>ยอดรวมสุทธิ<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;\">{{ grandTotalLabel }}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:16px; display:flex; justify-content:flex-end; gap:12px;\">\n        <button sc-camel-on-click=\"{{ toggleQuoteApprove }}\" style=\"{{ approveToggleButtonStyle }}\">{{ approveToggleButtonLabel }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ advanceStage }}\" style=\"{{ advanceButtonStyle }}\">ไปขั้นตอนเบิกอะไหล่ →<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ TAB 3: เบิกอะไหล่/ดำเนินการซ่อม ============ -->\n  <sc-if value=\"{{ isTab3 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start;\">\n      <div style=\"background:#fff; border-radius:14px; padding:26px 28px; border:1px solid #e3e5ea;\">\n        <div style=\"font-size:16px; font-weight:700; color:#171b23; margin-bottom:18px; padding-bottom:12px; border-bottom:2px solid #f1f2f5;\">รายการเบิกอะไหล่<\u002Fdiv>\n        <sc-for list=\"{{ parts }}\" as=\"part\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex; justify-content:space-between; align-items:center; padding:13px 2px; border-top:1px solid #f1f2f5;\">\n            <div>\n              <div style=\"font-size:14px; font-weight:600; color:#1f2430;\">{{ part.name }}<\u002Fdiv>\n              <div style=\"font-size:12px; color:#8b909b; margin-top:2px;\">จำนวน {{ part.qty }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div sc-camel-on-click=\"{{ part.onClick }}\" style=\"{{ part.badgeStyle }}\">{{ part.badgeLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"background:#fff; border-radius:14px; padding:26px 28px; border:1px solid #e3e5ea;\">\n        <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; padding-bottom:12px; border-bottom:2px solid #f1f2f5;\">\n          <div style=\"font-size:16px; font-weight:700; color:#171b23;\">งานซ่อม &amp; ผู้รับผิดชอบ<\u002Fdiv>\n          <div style=\"font-size:13px; color:#8b909b;\">คืบหน้า {{ taskProgressLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:8px; border-radius:4px; background:#f1f2f5; overflow:hidden; margin-bottom:16px;\">\n          <div style=\"{{ taskProgressBarStyle }}\"><\u002Fdiv>\n        <\u002Fdiv>\n        <sc-for list=\"{{ tasks }}\" as=\"task\" hint-placeholder-count=\"4\">\n          <div style=\"display:flex; justify-content:space-between; align-items:center; padding:13px 2px; border-top:1px solid #f1f2f5;\">\n            <div>\n              <div style=\"font-size:14px; font-weight:600; color:#1f2430;\">{{ task.name }}<\u002Fdiv>\n              <div style=\"font-size:12px; color:#8b909b; margin-top:2px;\">ช่าง: {{ task.assignee }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div sc-camel-on-click=\"{{ task.onClick }}\" style=\"{{ task.badgeStyle }}\">{{ task.badgeLabel }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:18px; display:flex; justify-content:flex-end;\">\n      <button sc-camel-on-click=\"{{ advanceStage }}\" style=\"{{ advanceButtonStyle }}\">งานซ่อมเสร็จสิ้น &amp; ไปขั้นตอน QC →<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ TAB 4: QC ============ -->\n  <sc-if value=\"{{ isTab4 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#fff; border-radius:14px; padding:26px 28px; border:1px solid #e3e5ea;\">\n      <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; padding-bottom:12px; border-bottom:2px solid #f1f2f5;\">\n        <div style=\"font-size:16px; font-weight:700; color:#171b23;\">ตรวจสอบคุณภาพงานซ่อม (QC)<\u002Fdiv>\n        <div style=\"font-size:13px; color:#8b909b;\">ผู้ตรวจ QC: <span style=\"font-weight:600; color:#1f2430;\">หัวหน้าช่างเอ<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:2fr 1fr 3fr; padding:0 4px 10px; font-size:12px; color:#8b909b; font-weight:600;\">\n        <div>รายการตรวจสอบ<\u002Fdiv><div>ผล (คลิกเพื่อเปลี่ยน)<\u002Fdiv><div>หมายเหตุ<\u002Fdiv>\n      <\u002Fdiv>\n      <sc-for list=\"{{ qcChecklist }}\" as=\"item\" hint-placeholder-count=\"4\">\n        <div style=\"display:grid; grid-template-columns:2fr 1fr 3fr; align-items:center; padding:13px 4px; border-top:1px solid #f1f2f5;\">\n          <div style=\"font-size:14px; font-weight:600; color:#1f2430;\">{{ item.name }}<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ item.onClick }}\" style=\"{{ item.badgeStyle }}\">{{ item.badgeLabel }}<\u002Fdiv>\n          <div style=\"font-size:13px; color:#6b7280;\">{{ item.note }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"margin-top:22px; display:flex; justify-content:flex-end;\">\n        <button sc-camel-on-click=\"{{ advanceStage }}\" style=\"{{ advanceButtonStyle }}\">ผ่าน QC &amp; ไปขั้นตอนชำระเงิน →<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ TAB 5: ชำระเงิน/ส่งมอบ ============ -->\n  <sc-if value=\"{{ isTab5 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:grid; grid-template-columns:1.1fr 1fr; gap:20px; align-items:start;\">\n      <div style=\"background:#fff; border-radius:14px; padding:26px 28px; border:1px solid #e3e5ea;\">\n        <div style=\"font-size:16px; font-weight:700; color:#171b23; margin-bottom:18px; padding-bottom:12px; border-bottom:2px solid #f1f2f5;\">สรุปยอดชำระ<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:10px;\">\n          <div style=\"display:flex; justify-content:space-between; font-size:14px; color:#3a3f4a;\"><span>ค่าอะไหล่ + ค่าแรง<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;\">{{ subtotalLabel }}<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; font-size:14px; color:#3a3f4a;\"><span>ส่วนลด<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;\">- ฿0.00<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; font-size:14px; color:#3a3f4a;\"><span>ภาษีมูลค่าเพิ่ม 7%<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace;\">{{ vatLabel }}<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; justify-content:space-between; font-size:20px; font-weight:700; color:#171b23; padding-top:12px; border-top:2px solid #f1f2f5;\"><span>ยอดชำระสุทธิ<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace; color:#d9622b;\">{{ grandTotalLabel }}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:22px;\">\n          <div style=\"font-size:12px; color:#8b909b; margin-bottom:10px;\">วิธีการชำระเงิน<\u002Fdiv>\n          <div style=\"display:flex; gap:10px;\">\n            <button sc-camel-on-click=\"{{ selectCash }}\" style=\"{{ cashButtonStyle }}\">เงินสด<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ selectTransfer }}\" style=\"{{ transferButtonStyle }}\">โอนเงิน<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ selectCard }}\" style=\"{{ cardButtonStyle }}\">บัตรเครดิต<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff; border-radius:14px; padding:26px 28px; border:1px solid #e3e5ea;\">\n        <div style=\"font-size:16px; font-weight:700; color:#171b23; margin-bottom:18px; padding-bottom:12px; border-bottom:2px solid #f1f2f5;\">ส่งมอบรถ<\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:14px 22px; margin-bottom:18px;\">\n          <div><div style=\"font-size:12px; color:#8b909b; margin-bottom:4px;\">ผู้ส่งมอบ<\u002Fdiv><div style=\"font-size:14px; font-weight:600; color:#1f2430;\">ช่างต้อม (หน้าร้าน)<\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:12px; color:#8b909b; margin-bottom:4px;\">ระยะเวลาซ่อมรวม<\u002Fdiv><div style=\"font-size:14px; font-weight:600; color:#1f2430;\">1 วัน 4 ชั่วโมง<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:110px; border-radius:10px; overflow:hidden; margin-bottom:8px;\"><image-slot id=\"signature-deliver\" shape=\"rect\" placeholder=\"ลายเซ็นลูกค้ารับรถคืน\"><\u002Fimage-slot><\u002Fdiv>\n        <div style=\"font-size:12px; color:#8b909b; margin-bottom:20px;\">ลายเซ็นลูกค้ายืนยันรับรถคืนและตรวจสอบความเรียบร้อย<\u002Fdiv>\n        <sc-if value=\"{{ delivered }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:#eaf7ee; border:1px solid #bfe6c9; border-radius:10px; padding:14px 16px; display:flex; align-items:center; gap:10px;\">\n            <span style=\"font-size:18px;\">✓<\u002Fspan>\n            <div>\n              <div style=\"font-size:14px; font-weight:700; color:#1a7f37;\">ส่งมอบรถเรียบร้อยแล้ว<\u002Fdiv>\n              <div style=\"font-size:12px; color:#3a3f4a;\">บันทึกเมื่อ 09:32 น. · {{ paymentMethodLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ notDelivered }}\" hint-placeholder-val=\"{{ true }}\">\n          <button sc-camel-on-click=\"{{ confirmDelivery }}\" style=\"width:100%; padding:14px; border:none; border-radius:10px; background:#171b23; color:#fff; font-size:15px; font-weight:700; cursor:pointer;\">ยืนยันส่งมอบรถ &amp; ปิดงาน<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst CHECKLIST_SEQ = ['none', 'ok', 'fail'];\nconst CHECKLIST_META = {\n  none: { label: 'ยังไม่ตรวจ', bg: '#f1f2f5', color: '#6b7280' },\n  ok: { label: 'ปกติ', bg: '#e8f7ec', color: '#1a7f37' },\n  fail: { label: 'ต้องซ่อม', bg: '#fdecea', color: '#c0392b' },\n};\nconst PART_SEQ = ['pending', 'issued', 'installed'];\nconst PART_META = {\n  pending: { label: 'รออนุมัติ', bg: '#f1f2f5', color: '#6b7280' },\n  issued: { label: 'เบิกแล้ว', bg: '#fdf1e6', color: '#c1691f' },\n  installed: { label: 'ติดตั้งแล้ว', bg: '#e8f7ec', color: '#1a7f37' },\n};\nconst TASK_SEQ = ['todo', 'doing', 'done'];\nconst TASK_META = {\n  todo: { label: 'รอดำเนินการ', bg: '#f1f2f5', color: '#6b7280' },\n  doing: { label: 'กำลังซ่อม', bg: '#fdf1e6', color: '#c1691f' },\n  done: { label: 'เสร็จสิ้น', bg: '#e8f7ec', color: '#1a7f37' },\n};\n\nconst STAGE_LABELS = ['รับรถ', 'ตรวจสอบ', 'เสนอราคา/งานซ่อม', 'เบิกอะไหล่/ดำเนินการซ่อม', 'QC', 'ชำระเงิน/ส่งมอบ'];\n\nfunction money(n) {\n  return '฿' + n.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });\n}\n\nconst badgeBase = 'display:inline-flex; align-items:center; justify-content:center; padding:6px 12px; border-radius:20px; font-size:12.5px; font-weight:700; cursor:pointer; user-select:none; width:fit-content;';\n\nclass Component extends DCLogic {\n  state = {\n    viewTab: 2,\n    stage: 2,\n    checklist: [\n      { id: 1, name: 'ระบบเบรก / ผ้าเบรก', status: 'fail', note: 'ผ้าเบรกหน้าเหลือ ๒ มม. ต้องเปลี่ยน' },\n      { id: 2, name: 'ช่วงล่าง / ลูกหมาก', status: 'fail', note: 'ลูกหมากปีกนกซ้ายมีเสียงดัง' },\n      { id: 3, name: 'ยาง / ล้อ', status: 'ok', note: 'ดอกยางเหลือ 70% ลมยางปกติ' },\n      { id: 4, name: 'แบตเตอรี่', status: 'ok', note: 'แรงดันไฟปกติ 12.6V' },\n      { id: 5, name: 'ระบบไฟส่องสว่าง', status: 'ok', note: '-' },\n      { id: 6, name: 'น้ำมันเครื่อง', status: 'fail', note: 'ถึงรอบเปลี่ยนตามระยะ' },\n      { id: 7, name: 'ระบบแอร์', status: 'ok', note: 'ความเย็นปกติ' },\n      { id: 8, name: 'ยางรองแท่นเครื่อง', status: 'none', note: 'รอผลตรวจเพิ่มเติม' },\n    ],\n    quoteItems: [\n      { id: 1, name: 'เปลี่ยนผ้าเบรกหน้า-หลัง', qty: 1, price: 1800, approved: true },\n      { id: 2, name: 'เปลี่ยนลูกหมากปีกนกซ้าย', qty: 1, price: 950, approved: true },\n      { id: 3, name: 'เปลี่ยนน้ำมันเครื่อง + ไส้กรอง', qty: 1, price: 1200, approved: true },\n      { id: 4, name: 'ค่าแรงตรวจเช็ค + ซ่อม', qty: 1, price: 900, approved: false },\n    ],\n    quoteApproved: true,\n    parts: [\n      { id: 1, name: 'ผ้าเบรกหน้า-หลัง (แท้ศูนย์)', qty: '1 ชุด', status: 'installed' },\n      { id: 2, name: 'ลูกหมากปีกนกซ้าย', qty: '1 ชิ้น', status: 'issued' },\n      { id: 3, name: 'น้ำมันเครื่อง 5W-30', qty: '4 ลิตร', status: 'issued' },\n      { id: 4, name: 'ไส้กรองน้ำมันเครื่อง', qty: '1 ชิ้น', status: 'pending' },\n    ],\n    tasks: [\n      { id: 1, name: 'ถอด-เปลี่ยนผ้าเบรก', assignee: 'ช่างวิน', status: 'done' },\n      { id: 2, name: 'เปลี่ยนลูกหมากปีกนก', assignee: 'ช่างโอ๊ต', status: 'doing' },\n      { id: 3, name: 'ถ่ายน้ำมันเครื่อง', assignee: 'ช่างวิน', status: 'todo' },\n      { id: 4, name: 'ทดสอบขับ + เช็คเสียง', assignee: 'ช่างโอ๊ต', status: 'todo' },\n    ],\n    paymentMethod: 'cash',\n    delivered: false,\n    qcChecklist: [\n      { id: 1, name: 'ทดสอบเบรกหลังเปลี่ยนผ้าเบรก', status: 'ok', note: 'เบรกนุ่ม ไม่มีเสียงดัง' },\n      { id: 2, name: 'ทดสอบขับช่วงล่าง', status: 'ok', note: 'ไม่มีอาการสั่นที่ความเร็วสูง' },\n      { id: 3, name: 'ตรวจสอบระดับน้ำมันเครื่อง/รอยรั่วซึม', status: 'ok', note: '-' },\n      { id: 4, name: 'ทำความสะอาดรถก่อนส่งมอบ', status: 'none', note: 'รอดำเนินการ' },\n    ],\n  };\n\n  goToTab(i) { this.setState({ viewTab: i }); }\n  advanceStage() {\n    this.setState(s => ({ stage: Math.min(s.stage + 1, 5), viewTab: Math.min(s.stage + 1, 5) }));\n  }\n  cycleChecklist(id) {\n    this.setState(s => ({\n      checklist: s.checklist.map(it => it.id === id ? { ...it, status: CHECKLIST_SEQ[(CHECKLIST_SEQ.indexOf(it.status) + 1) % 3] } : it)\n    }));\n  }\n  cycleQc(id) {\n    this.setState(s => ({\n      qcChecklist: s.qcChecklist.map(it => it.id === id ? { ...it, status: CHECKLIST_SEQ[(CHECKLIST_SEQ.indexOf(it.status) + 1) % 3] } : it)\n    }));\n  }\n  cyclePart(id) {\n    this.setState(s => ({\n      parts: s.parts.map(p => p.id === id ? { ...p, status: PART_SEQ[(PART_SEQ.indexOf(p.status) + 1) % 3] } : p)\n    }));\n  }\n  cycleTask(id) {\n    this.setState(s => ({\n      tasks: s.tasks.map(t => t.id === id ? { ...t, status: TASK_SEQ[(TASK_SEQ.indexOf(t.status) + 1) % 3] } : t)\n    }));\n  }\n  toggleQuoteItemApprove(id) {\n    this.setState(s => ({ quoteItems: s.quoteItems.map(q => q.id === id ? { ...q, approved: !q.approved } : q) }));\n  }\n  toggleQuoteApprove() { this.setState(s => ({ quoteApproved: !s.quoteApproved })); }\n  selectPayment(m) { this.setState({ paymentMethod: m }); }\n  confirmDelivery() { this.setState({ delivered: true }); }\n\n  renderVals() {\n    const s = this.state;\n    const viewTab = s.viewTab;\n    const stage = s.stage;\n\n    const stages = STAGE_LABELS.map((label, i) => {\n      const done = i < stage;\n      const active = i === stage;\n      const viewed = i === viewTab;\n      let circleBg = '#262c38', circleColor = '#6b7280', circleBorder = '2px solid #333a47';\n      if (done) { circleBg = '#1a7f37'; circleColor = '#fff'; circleBorder = '2px solid #1a7f37'; }\n      if (active) { circleBg = '#d9622b'; circleColor = '#fff'; circleBorder = '2px solid #d9622b'; }\n      const ring = viewed ? 'box-shadow:0 0 0 4px rgba(217,98,43,0.28);' : '';\n      return {\n        index: i,\n        label,\n        number: i + 1,\n        showCheck: done,\n        showNumber: !done,\n        flexGrow: i === STAGE_LABELS.length - 1 ? '0 0 auto' : '1 1 auto',\n        hasConnector: i < STAGE_LABELS.length - 1,\n        onClick: () => this.goToTab(i),\n        circleStyle: `width:44px;height:44px;border-radius:50%;background:${circleBg};color:${circleColor};border:${circleBorder};display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;font-family:'IBM Plex Mono',monospace;transition:all .2s;${ring}`,\n        labelStyle: `font-size:12.5px; font-weight:${viewed ? 700 : 500}; color:${viewed ? '#fff' : (done || active ? '#d5d9e0' : '#6b7280')}; text-align:center; max-width:92px; line-height:1.3;`,\n        connectorStyle: `height:2px; background:${done ? '#1a7f37' : '#333a47'}; flex:1; margin:21px 8px 0;`,\n      };\n    });\n\n    const checklist = s.checklist.map(it => {\n      const meta = CHECKLIST_META[it.status];\n      return { ...it, badgeLabel: meta.label, badgeStyle: `${badgeBase} background:${meta.bg}; color:${meta.color};`, onClick: () => this.cycleChecklist(it.id) };\n    });\n    const qcChecklist = s.qcChecklist.map(it => {\n      const meta = CHECKLIST_META[it.status];\n      return { ...it, badgeLabel: meta.label, badgeStyle: `${badgeBase} background:${meta.bg}; color:${meta.color};`, onClick: () => this.cycleQc(it.id) };\n    });\n\n    const quoteItems = s.quoteItems.map(it => {\n      const total = it.qty * it.price;\n      return {\n        ...it,\n        priceLabel: money(it.price),\n        totalLabel: money(total),\n        approveLabel: it.approved ? '✓ อนุมัติ' : 'รออนุมัติ',\n        approveStyle: `${badgeBase} background:${it.approved ? '#e8f7ec' : '#f1f2f5'}; color:${it.approved ? '#1a7f37' : '#8b909b'};`,\n        onClick: () => this.toggleQuoteItemApprove(it.id),\n      };\n    });\n    const subtotal = s.quoteItems.reduce((sum, it) => sum + it.qty * it.price, 0);\n    const vat = subtotal * 0.07;\n    const grandTotal = subtotal + vat;\n\n    const parts = s.parts.map(p => {\n      const meta = PART_META[p.status];\n      return { ...p, badgeLabel: meta.label, badgeStyle: `${badgeBase} background:${meta.bg}; color:${meta.color};`, onClick: () => this.cyclePart(p.id) };\n    });\n\n    const tasks = s.tasks.map(t => {\n      const meta = TASK_META[t.status];\n      return { ...t, badgeLabel: meta.label, badgeStyle: `${badgeBase} background:${meta.bg}; color:${meta.color};`, onClick: () => this.cycleTask(t.id) };\n    });\n    const doneCount = s.tasks.filter(t => t.status === 'done').length;\n    const taskPct = Math.round((doneCount / s.tasks.length) * 100);\n\n    const paymentLabels = { cash: 'เงินสด', transfer: 'โอนเงิน', card: 'บัตรเครดิต' };\n    const payBtn = (key, label) => {\n      const active = s.paymentMethod === key;\n      return `flex:1; padding:12px; border-radius:10px; border:2px solid ${active ? '#d9622b' : '#e3e5ea'}; background:${active ? '#fdf1e6' : '#fff'}; color:${active ? '#c1691f' : '#3a3f4a'}; font-size:14px; font-weight:700; cursor:pointer;`;\n    };\n\n    let overallBadgeText = STAGE_LABELS[stage];\n    let overallBadgeStyle = \"padding:8px 16px; border-radius:20px; background:#d9622b; color:#fff; font-size:13px; font-weight:700;\";\n\n    return {\n      isTab0: viewTab === 0, isTab1: viewTab === 1, isTab2: viewTab === 2, isTab3: viewTab === 3, isTab4: viewTab === 4, isTab5: viewTab === 5,\n      stages, checklist, qcChecklist, quoteItems, parts, tasks,\n      overallBadgeText, overallBadgeStyle,\n      subtotalLabel: money(subtotal), vatLabel: money(vat), grandTotalLabel: money(grandTotal),\n      quoteStatusLabel: s.quoteApproved ? 'ลูกค้าอนุมัติแล้ว' : 'รอลูกค้าอนุมัติ',\n      quoteStatusStyle: `padding:7px 14px; border-radius:20px; font-size:12.5px; font-weight:700; background:${s.quoteApproved ? '#e8f7ec' : '#fdf1e6'}; color:${s.quoteApproved ? '#1a7f37' : '#c1691f'};`,\n      approveToggleButtonLabel: s.quoteApproved ? '✓ ลูกค้าอนุมัติแล้ว' : 'ทำเครื่องหมายว่าลูกค้าอนุมัติ',\n      approveToggleButtonStyle: `padding:12px 20px; border-radius:10px; border:2px solid ${s.quoteApproved ? '#1a7f37' : '#e3e5ea'}; background:${s.quoteApproved ? '#e8f7ec' : '#fff'}; color:${s.quoteApproved ? '#1a7f37' : '#3a3f4a'}; font-size:14px; font-weight:700; cursor:pointer;`,\n      advanceButtonStyle: `padding:12px 22px; border-radius:10px; border:none; background:#171b23; color:#fff; font-size:14px; font-weight:700; cursor:pointer;`,\n      taskProgressLabel: `${doneCount}/${s.tasks.length} งาน (${taskPct}%)`,\n      taskProgressBarStyle: `height:100%; width:${taskPct}%; background:#d9622b; border-radius:4px; transition:width .3s;`,\n      cashButtonStyle: payBtn('cash'), transferButtonStyle: payBtn('transfer'), cardButtonStyle: payBtn('card'),\n      selectCash: () => this.selectPayment('cash'), selectTransfer: () => this.selectPayment('transfer'), selectCard: () => this.selectPayment('card'),\n      paymentMethodLabel: paymentLabels[s.paymentMethod],\n      delivered: s.delivered, notDelivered: !s.delivered,\n      confirmDelivery: () => this.confirmDelivery(),\n      toggleQuoteApprove: () => this.toggleQuoteApprove(),\n      advanceStage: () => this.advanceStage(),\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
