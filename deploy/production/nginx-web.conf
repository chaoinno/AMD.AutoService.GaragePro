server {
    listen 80;
    listen [::]:80;
    # service.garage-pro.net = ชื่อใหม่หลัง rebrand เป็น ServicePro (2026-10-05) · gpservice ยังใช้ต่อ ไม่ redirect
    server_name gpservice.garage-pro.net service.garage-pro.net;

    access_log /var/log/nginx/gpservice.access.log;
    error_log /var/log/nginx/gpservice.error.log;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
