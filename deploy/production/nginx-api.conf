server {
    listen 80;
    listen [::]:80;
    server_name gpservice-api.garage-pro.net;

    access_log /var/log/nginx/gpservice-api.access.log;
    error_log /var/log/nginx/gpservice-api.error.log;

    client_max_body_size 16m;

    # BEGIN gp-api-rate-limit — add-api-rate-limit.sh คัดบล็อกนี้ (ถึง END) ไปแทรกก่อน "location / {" ของ vhost จริง แก้ที่นี่ที่เดียว
    # [SECURITY] login/signup ต่อ IP — zone อยู่ใน /etc/nginx/conf.d/garagepro-service-ratelimit.conf (nginx-ratelimit.conf)
    # ใช้ regex ไม่สนตัวพิมพ์ + "/" ท้าย เพราะ routing ของ ASP.NET ไม่สน — "location = ..." ถูกเลี่ยงได้ด้วย /API/v1/Auth/Login
    location ~* ^/api/v1/auth/login/?$ {
        limit_req zone=gp_login burst=5 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;
        error_page 429 = @gp_login_rate_limited;

        proxy_pass http://127.0.0.1:5081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ~* ^/api/v1/public/signup(/|$) {
        limit_req zone=gp_signup burst=3 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;
        error_page 429 = @gp_signup_rate_limited;

        proxy_pass http://127.0.0.1:5081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 429 ที่ Nginx ตอบเองใช้ envelope เดียวกับ API (แอปมือถือแสดง messageTh ได้) + Retry-After ให้ web client
    # · error_page มีผลเฉพาะ 429 ของ limit_req — 429 ของ ASP.NET ผ่านไปตามเดิม (proxy_intercept_errors ปิดอยู่)
    # · X-RateLimit-Layer ใช้แยกชั้นตอนตรวจ (add-api-rate-limit.sh)
    location @gp_login_rate_limited {
        default_type "application/json; charset=utf-8";
        add_header Retry-After 60 always;
        add_header X-RateLimit-Layer nginx always;
        add_header Access-Control-Allow-Origin $gp_rate_limit_cors_origin always;
        add_header Vary Origin always;
        return 429 '{"success":false,"data":null,"error":{"code":"AUTH_RATE_LIMITED","messageTh":"พยายามเข้าสู่ระบบถี่เกินไป กรุณารอสักครู่แล้วลองใหม่","details":{"retryAfterSeconds":60}},"traceId":"$request_id"}';
    }

    location @gp_signup_rate_limited {
        default_type "application/json; charset=utf-8";
        add_header Retry-After 60 always;
        add_header X-RateLimit-Layer nginx always;
        add_header Access-Control-Allow-Origin $gp_rate_limit_cors_origin always;
        add_header Vary Origin always;
        return 429 '{"success":false,"data":null,"error":{"code":"SIGNUP_RATE_LIMITED","messageTh":"ส่งคำขอสมัครถี่เกินไป กรุณารอสักครู่แล้วลองใหม่ หรือติดต่อ LINE @garagepro","details":{"retryAfterSeconds":60}},"traceId":"$request_id"}';
    }
    # END gp-api-rate-limit

    location / {
        proxy_pass http://127.0.0.1:5081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
