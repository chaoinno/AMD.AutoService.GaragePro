name: garagepro-service

services:
  api:
    build:
      context: ${GARAGEPRO_SOURCE_DIR:-../..}
      dockerfile: ${GARAGEPRO_DEPLOY_DIR:-deploy/production}/Dockerfile.api
    image: garagepro-service-api:latest
    container_name: garagepro_service_api
    restart: unless-stopped
    env_file:
      - path: ${GARAGEPRO_SECRETS_FILE:-/home/deployment/config/garagepro-service.env}
        format: raw
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      TZ: Asia/Bangkok
      AllowedOrigins__0: https://gpservice.garage-pro.net
      # เว็บโดเมนใหม่เรียก API ข้าม origin — ไม่ใส่แล้ว browser จะบล็อกทุกคำขอ (CORS) ตั้งแต่หน้า login
      AllowedOrigins__1: https://service.garage-pro.net
      LegacyShards__DefaultShard: db2
      Jwt__Issuer: AMD.AutoService.GaragePro
      Jwt__Audience: AMD.AutoService.GaragePro.Clients
      Jwt__PreSessionMinutes: "15"
      Jwt__SessionHours: "12"
      Ftp__RootPath: /AutoServiceGaragePro/attachments/
      VehicleImages__RootPath: /app/storage/vehicle-images
      StaffImages__RootPath: /app/storage/staff-images
      # self-serve trial (shard sp1) — มีผลเฉพาะเมื่อ env file มี SelfServe__ConnectionString
      # [BIZ] สวิตช์รับสมัครใหม่ SelfServe__Enabled อยู่ใน env file ที่เดียว (user-secrets Production:SelfServe:Enabled → bootstrap)
      #       ไม่มีบรรทัดนั้น = ปิดรับสมัคร (ค่าเริ่มต้นของ SelfServeOptions) · ปิดแล้วอู่ที่มีอยู่ยังใช้งาน/หมดอายุตามปกติ
      #       ห้ามใส่ SelfServe__Enabled ใน environment นี้: environment ชนะ env_file และเดิมการลืมใส่ SELFSERVE_ENABLED
      #       ตอน deploy ครั้งเดียวก็ปิดรับสมัครเงียบๆ
      SelfServe__ShardKey: sp1
      SelfServe__PublicBaseUrl: https://service.garage-pro.net
      SelfServe__Trial__Days: "30"
      SelfServe__Trial__ReadOnlyDays: "90"
      SelfServe__Jobs__Enabled: "true"
    ports:
      - "127.0.0.1:${API_PORT:-5081}:8080"
    volumes:
      - garagepro_service_storage:/app/storage
    networks:
      - internal
      # GaragePro Admin API เรียก API ภายใน (/api/v1/internal · docs/17 §8.6) ผ่าน http://garagepro_service_api:8080
      # ไม่ผ่านอินเทอร์เน็ต · Nginx ของโดเมนสาธารณะตอบ 404 ให้ path นี้ (add-api-internal-deny.sh)
      - servicepro

  web:
    build:
      context: ${GARAGEPRO_SOURCE_DIR:-../..}
      dockerfile: ${GARAGEPRO_DEPLOY_DIR:-deploy/production}/Dockerfile.web
      additional_contexts:
        deployment: ${GARAGEPRO_DEPLOY_DIR:-deploy/production}
      args:
        VITE_API_BASE_URL: https://gpservice-api.garage-pro.net
        VITE_LEGACY_ASSET_BASE_URL: https://media.garage-pro.net/
        VITE_SITE_URL: https://service.garage-pro.net
        # ค่าสาธารณะ (ไม่ใช่ความลับ) — deploy-production.sh อ่านจาก env file แล้ว export ให้ตอน build
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    image: garagepro-service-web:latest
    container_name: garagepro_service_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3005}:8080"
    networks:
      - internal

networks:
  internal:
    driver: bridge
  # network ร่วมกับ GaragePro Admin สร้างครั้งเดียวต่อเครื่อง นอก compose ทั้งสอง project:
  #   docker network create garagepro-servicepro
  # scripts/deploy-production.sh สร้างให้เองถ้ายังไม่มี (ไม่มีแล้ว compose run/up ล้มด้วย "declared as external, but could not be found")
  servicepro:
    external: true
    name: garagepro-servicepro

volumes:
  garagepro_service_storage:
