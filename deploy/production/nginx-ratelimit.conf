# ServicePro API — IP จริงจาก Cloudflare + โซน rate limit (http context)
# ติดตั้งเป็น /etc/nginx/conf.d/garagepro-service-ratelimit.conf โดย add-api-rate-limit.sh (server เดิม)
# หรือ install-nginx.sh (ติดตั้งใหม่) — ไฟล์นี้ต้องมาก่อน vhost ที่อ้าง zone gp_login/gp_signup ไม่งั้น nginx -t ไม่ผ่าน
#
# [SECURITY] ทำไมต้องมี real_ip: API อยู่หลัง Cloudflare → Nginx → container ถ้าไม่ตั้ง $remote_addr คือ IP ของ
# Cloudflare edge ทั้ง limit_req ของ Nginx และ rate limit ต่อ IP ของ ASP.NET (อ่าน X-Forwarded-For ตัวขวาสุดที่ Nginx
# เติม = $remote_addr) จะนับผู้ใช้ทุกคนที่วิ่งผ่าน edge เดียวกันเป็นคนเดียว
# · set_real_ip_from จำกัดว่าเชื่อ CF-Connecting-IP เฉพาะคำขอที่มาจากช่วง IP ของ Cloudflare เท่านั้น — คนที่ยิงตรงเข้า
#   origin แล้วปลอม header นี้มาจะยังได้ IP ของตัวเอง
# · ผลข้างเคียง: directive ระดับ http มีผลกับทุก vhost บนเครื่องนี้ (log ของเว็บอื่นจะเห็น IP จริงแทน IP ของ Cloudflare)
#   ถ้ามี vhost อื่นที่ allow/deny ตามช่วง IP ของ Cloudflare ต้องตรวจก่อนติดตั้ง
#
# ช่วง IP ดึงจาก https://www.cloudflare.com/ips-v4 และ https://www.cloudflare.com/ips-v6 เมื่อ 2026-10-14
# REFRESH: Cloudflare เพิ่ม/เปลี่ยนช่วงได้ — ตรวจเทียบสองลิงก์นี้อย่างน้อยทุกไตรมาส ช่วงที่ขาดไป = ผู้ใช้กลุ่มนั้นถูกนับเป็น
# IP ของ edge (ไม่พัง แต่ rate limit รวมกัน) แก้ไฟล์นี้ใน repo แล้วรัน add-api-rate-limit.sh ซ้ำ (มันติดตั้งไฟล์ใหม่ทับให้)

# Cloudflare IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# Cloudflare IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# preflight (OPTIONS) ของเบราว์เซอร์ไม่นับ — key ว่าง = limit_req ไม่นับคำขอนั้น
# ถ้านับ ทุก login จากเว็บจะกินโควตา 2 ครั้ง (OPTIONS + POST) แอปมือถือไม่มี preflight จึงได้โควตาเต็ม
map $request_method $gp_rate_limit_key {
    OPTIONS "";
    default $binary_remote_addr;
}

# ต่อ IP: login 10 ครั้ง/นาที · signup 5 ครั้ง/นาที (burst ตั้งที่ location ใน vhost)
# ชั้นนี้เป็นด่านแรกกันคำขอท่วมก่อนถึง container — ชั้น ASP.NET (RateLimitingSetup.cs) ยังบังคับซ้ำและละเอียดกว่า
limit_req_zone $gp_rate_limit_key zone=gp_login:10m rate=10r/m;
limit_req_zone $gp_rate_limit_key zone=gp_signup:10m rate=5r/m;

# CORS ของคำตอบ 429 ที่ Nginx ตอบเอง (ไม่ผ่าน ASP.NET ที่ใส่ CORS ให้) — ไม่มี header นี้ เบราว์เซอร์จะซ่อนคำตอบ
# แล้วหน้าเว็บเห็นเป็น "เชื่อมต่อไม่ได้" แทน "ถี่เกินไป" · ต้องตรงกับ AllowedOrigins ของ API
map $http_origin $gp_rate_limit_cors_origin {
    default "";
    "https://service.garage-pro.net" $http_origin;
    "https://gpservice.garage-pro.net" $http_origin;
}

# limit_req_status 429 ตั้งที่ location ของเราเอง ไม่ตั้งที่นี่ — ระดับ http จะเปลี่ยนสถานะ (503 → 429)
# ของ vhost อื่นบนเครื่องนี้ที่ใช้ limit_req อยู่ด้วย
